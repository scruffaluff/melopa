# Python configuration file for building, dependencies, and tooling.
#
# For more information, visit
# https://snarky.ca/what-the-heck-is-pyproject-toml.

[build-system]
build-backend = "uv_build"
requires = ["uv-build~=0.11"]

[dependency-groups]
dev = [
  "coverage~=7.14",
  "jinja2-cli~=1.0",
  "pytest~=9.1",
  "pytest-cov~=7.1",
  "pytest-mock~=3.15",
  "python-lsp-server~=1.14",
  "pyzmq~=27.1",
  "ruff~=0.15.18",
  "ty~=0.0.50",
]

[project]
# Dependency constraints must be flexible for WASM compatibility with Micropip.
dependencies = [
  "bokeh~=3.9",
  "marimo~=0.23.10",
  "matplotlib~=3.10",
  "numpy~=2.4",
  "polars~=1.33",
  "scipy~=1.17",
  "soundfile~=0.12.0",
]
description = "Interactive Python audio notebooks."
keywords = []
name = "melopa"
readme = "README.md"
requires-python = ">=3.12.0,<4.0.0"
version = "0.1.0"

[tool.coverage.report]
exclude_lines = [
  "if sys.version_info.*",
  "pragma: no cover",
  "raise NotImplementedError",
]
fail_under = 0
show_missing = true

[tool.coverage.run]
branch = true
command_line = "-m pytest"
omit = []
source = ["melopa"]

[tool.marimo]
display = { custom_css = ["data/marimo.css"] }
formatting = { line_length = 80 }

[tool.marimo.keymap.overrides]
"cell.complete" = "Ctrl-i"
"cell.toggleComment" = "Ctrl-/"
"completion.moveDown" = "Ctrl-n"
"completion.moveUp" = "Ctrl-p"

[tool.marimo.runtime]
auto_instantiate = true
output_max_bytes = 1000000000

[tool.pytest]
addopts = ["-sv"]
cache_dir = ".vendor/cache/pytest"
markers = ["e2e: mark as end to end test.", "unit: mark as unit test."]
python_files = ["__init__.py", "*_test.py"]
testpaths = ["src", "test"]

[tool.ruff]
cache-dir = ".vendor/cache/ruff"
extend-include = ["*.md"]
preview = true

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
flake8-annotations = { allow-star-arg-any = true }
pydocstyle = { convention = "google" }
ignore = [
  "COM",     # Rule conflicts with formatter.
  "CPY001",  # There should not a copyright notice in every module.
  "DOC201",  # Not every function docstring needs a returns section.
  "DOC402",  # Not every generator docstring needs a yields section.
  "EXE003",  # Uv should be shebang executor.
  "FBT",     # Boolean function arguments are acceptable.
  "FIX",     # Todo comments are acceptable.
  "ICN",     # Import abbreviations reduce readability.
  "PLR2004", # Constant numerical comparisons are often readable.
  "RUF067",  # Init modules should be able to contain code.
  "S101",    # Assert statements are standard for test functions.
  "S603",    # Rule warns about using subprocess commands without a solution.
  "S607",    # Partial paths for process executables is more cross platform.
  "T201",    # Print statements are acceptable for CLI applications.
  "T203",    # Print statements are acceptable for CLI applications.
  "TD",      # Todo formatting is excessive for personal projects.
]
select = ["ALL"]

[tool.ty]
terminal = { error-on-warning = true }

[tool.uv.build-backend]
source-exclude = ["*.test.ts", "*_test.py"]
