# GitHub Actions workflow file.
#
# For more information, visit
# https://docs.github.com/actions/learn-github-actions.

---
name: main

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - "**"
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      debug:
        default: false
        description: Use Tmate session for debugging
        type: boolean
      job:
        description: CI job to run
        options:
          - build
          - pages
        required: true
        type: choice

env:
  DENO_DIR: "${{ github.workspace }}/.vendor/cache/deno"
  PLAYWRIGHT_BROWSERS_PATH: "${{ github.workspace }}/.vendor/cache/playwright"
  UV_CACHE_DIR: "${{ github.workspace }}/.vendor/cache/uv"

jobs:
  build:
    if: >-
      ${{ github.ref_type == 'branch' && github.event_name !=
      'workflow_dispatch' || inputs.job == 'build' }}
    name: Run code analyses and test suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ hashFiles('uv.lock') }}
          path: |
            .vendor
            .venv
            node_modules
      - name: Install Just
        run: >-
          curl -LSfs https://scruffaluff.github.io/picoware/install/just.sh | sh
          -s -- --global
      - name: Run CI workflow commands
        run: just ci
      - if: ${{ always() && inputs.debug }}
        name: Launch Tmate session if debug enabled
        timeout-minutes: 60
        uses: mxschmitt/action-tmate@v3

  pages:
    environment:
      name: github-pages
    if: >-
      ${{ github.ref == 'refs/heads/main' && github.event_name !=
      'workflow_dispatch' || inputs.job == 'pages' }}
    name: Build and publish documentation
    permissions:
      id-token: write
      pages: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          key: ${{ runner.os }}-${{ hashFiles('uv.lock') }}
          path: |
            .vendor
            .venv
            node_modules
      - name: Install Just
        run: >-
          curl -LSfs https://scruffaluff.github.io/picoware/install/just.sh | sh
          -s -- --global
      - name: Build documentation
        run: just setup build
      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          name: pages
          path: build/site
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        with:
          artifact_name: pages
      - if: ${{ always() && inputs.debug }}
        name: Launch Tmate session if debug enabled
        timeout-minutes: 60
        uses: mxschmitt/action-tmate@v3

  release:
    if: >-
      ${{ github.ref_type == 'tag' && github.event_name != 'workflow_dispatch'
      || inputs.job == 'release' }}
    name: Make GitHub release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Just
        run: >-
          curl -LSfs https://scruffaluff.github.io/picoware/install/just.sh | sh
          -s -- --global
      - name: Build Python package
        run: just setup build
      - name: Publish package
        env:
          UV_PUBLISH_TOKEN: "${{ secrets.UV_PUBLISH_TOKEN }}"
        run: just uv publish build/dist/melopa-*
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          body: >-
            See the [changelog](https://github.com/scruffaluff/melopa/blob/${{
            github.ref_name }}/CHANGELOG.md) for more information.
          files: |
            build/dist/melpa-${{ github.ref_name }}-py3-none-any.whl
            build/dist/melpa-${{ github.ref_name }}.tar.gz
          name: Melopa ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
      - if: ${{ always() && inputs.debug }}
        name: Launch Tmate session if debug enabled
        timeout-minutes: 60
        uses: mxschmitt/action-tmate@v3
